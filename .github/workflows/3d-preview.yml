name: KiCad 3D preview

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Registered PCB or PCB-only project ID to render
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    uses: sheepfling/KiCad-Tooling/.github/workflows/3d-preview.yml@683cd567942ae8bc1a4f753cf0d259808fe1ee9f
    with:
      project_id: ${{ inputs.project_id }}
