name: Electrical analysis

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Registered board or schematic with reviewed electrical requirements
        required: true
        type: string
      ngspice_version:
        description: Approved ngspice release; must match the project contract
        required: true
        type: string
        default: '47'
      ngspice_sha256:
        description: Reviewed SHA-256 of the official ngspice source archive for this version
        required: true
        type: string
        default: '894e649651f1838a14095e5a5439e7d3aa63e87ede14d283173fda4fcdef675f'

permissions:
  contents: read

jobs:
  electrical:
    name: Analyze ${{ inputs.project_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      NGSPICE_VERSION: ${{ inputs.ngspice_version }}
      NGSPICE_SHA256: ${{ inputs.ngspice_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tooling.txt
      - name: Install policy tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-tooling.txt
      - name: Check selected project requirements
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -B -m kicad_tooling.ci --project "$PROJECT_ID" --output build/electrical-portable --format text
      - name: Build the approved simulator from verified source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NGSPICE_VERSION" =~ ^[0-9]+([.][0-9]+)*$ ]]
          [[ "$NGSPICE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex
          mkdir -p build/ngspice-build
          archive="ngspice-${NGSPICE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --max-time 120 \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/${NGSPICE_VERSION}/${archive}" \
            -o "build/ngspice-build/${archive}"
          printf '%s  %s\n' "$NGSPICE_SHA256" "build/ngspice-build/${archive}" | sha256sum --check --strict
          tar -xzf "build/ngspice-build/${archive}" -C build/ngspice-build
          prefix="$PWD/build/ngspice"
          cd "build/ngspice-build/ngspice-${NGSPICE_VERSION}"
          ./configure --prefix="$prefix" --without-x --disable-debug --with-readline=no --disable-openmp \
            > ../configure.log 2>&1
          make -j2 > ../make.log 2>&1
          make install > ../install.log 2>&1
      - name: Preflight native and electrical tools
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -B -m kicad_tooling.template doctor --electrical --project-id "$PROJECT_ID" \
            --runner container --ngspice "$PWD/build/ngspice/bin/ngspice" --format json \
            | tee build/electrical-preflight.json
      - name: Run focused electrical analysis
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -B -m kicad_tooling.ci --electrical --project "$PROJECT_ID" \
            --ngspice "$PWD/build/ngspice/bin/ngspice" --format json \
            | tee build/electrical-suite.json
      - name: Render charts and CSV from saved receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/electrical-suite.json ]]; then
            .venv/bin/python -B -m kicad_tooling.electrical_charts --suite build/electrical-suite.json --format json \
              | tee build/electrical-charts.json
          fi
      - name: Retain results and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electrical-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/electrical-portable/
            build/electrical/
            build/electrical-preflight.json
            build/electrical-suite.json
            build/electrical-charts/
            build/electrical-charts.json
            build/ngspice-build/*.log
          if-no-files-found: warn
          retention-days: 30
