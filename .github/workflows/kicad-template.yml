name: KiCad template acceptance
on:
  pull_request:
  workflow_dispatch:
    inputs:
      focus:
        description: Full acceptance, a branch diff, or a focused project, product or tag
        type: choice
        options: [full, branch, project, product, tag]
        default: full
        required: true
      value:
        description: Base ref (for branch, e.g. origin/main), project ID, product ID or tag
        type: string
        required: false
      exclude_tag:
        description: Optional exclusion for project, product or tag focus
        type: string
        required: false
      shard:
        description: Optional partial project shard INDEX/COUNT, e.g. 1/3
        type: string
        required: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kicad-template-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Verification
    uses: sheepfling/KiCad-Tooling/.github/workflows/kicad-template.yml@683cd567942ae8bc1a4f753cf0d259808fe1ee9f
    with:
      focus: ${{ inputs.focus || 'full' }}
      value: ${{ inputs.value || '' }}
      exclude_tag: ${{ inputs.exclude_tag || '' }}
      shard: ${{ inputs.shard || '' }}
