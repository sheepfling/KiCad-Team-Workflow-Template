name: Selected release candidate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Registered project ID to rehearse from this exact source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    uses: sheepfling/KiCad-Tooling/.github/workflows/release-candidate.yml@683cd567942ae8bc1a4f753cf0d259808fe1ee9f
    with:
      project_id: ${{ inputs.project_id }}
