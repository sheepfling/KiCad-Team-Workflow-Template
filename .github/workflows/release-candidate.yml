name: Selected release candidate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Registered project ID to rehearse from this exact source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    uses: sheepfling/KiCad-Tooling/.github/workflows/release-candidate.yml@5574f7965fec767284529ae263bef704cfaa7f43
    with:
      project_id: ${{ inputs.project_id }}
