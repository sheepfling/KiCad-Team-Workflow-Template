name: Selected release candidate

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Registered project ID to rehearse from this exact source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Prepare and restore ${{ inputs.project_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tooling.txt
      - name: Install policy dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-tooling.txt
      - name: Prepare selected engineering review candidate
        timeout-minutes: 30
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          if [ "$checked_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out commit $checked_sha differs from dispatched commit $GITHUB_SHA"
            exit 1
          fi
          release_id="hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Preparing $PROJECT_ID at $GITHUB_SHA as $release_id"
          python -B -m kicad_tooling.release prepare \
            --project "$PROJECT_ID" --release-id "$release_id" \
            --release-class engineering_review --format text
          echo "Checking candidate manifest"
          python -B -m kicad_tooling.release check \
            --manifest "build/releases/$release_id/manifest.json" --format text
          echo "Packaging and restore-verifying candidate"
          python -B -m kicad_tooling.release package \
            --manifest "build/releases/$release_id/manifest.json" \
            --output "build/$release_id.zip" --format text
          python -B -m kicad_tooling.release verify \
            --archive "build/$release_id.zip" --format text
          git diff --exit-code
      - name: Retain candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/releases/
            build/hosted-*.zip
          if-no-files-found: warn
          retention-days: 30
