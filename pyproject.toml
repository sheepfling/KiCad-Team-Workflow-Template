[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-team-template-policy"
version = "1.3.2"
description = "Typed policy and deterministic review tooling for the generic KiCad team template"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "snakemd==2.4.1",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
dev = [
  "mcp==2.2.0",
  "pyright==1.1.411",
  "nodeenv==1.10.0",
  "ruff==0.16.1",
  "snakemd-stubs==2.4.1.0",
]

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["tools"]
extraPaths = ["."]
exclude = ["build"]
