[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-team-template-policy"
version = "1.3.2"
description = "Typed policy and deterministic review tooling for the generic KiCad team template"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "snakemd==2.4.1",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
charts = ["matplotlib==3.11.2"]
cad = ["easyeda2kicad==1.0.1"]
dev = [
  "mcp==2.2.0",
  "matplotlib==3.11.2",
  "pyright==1.1.411",
  "nodeenv==1.10.0",
  "ruff==0.16.1",
  "snakemd-stubs==2.4.1.0",
  "rumdl==0.2.77",
  "mdrepo @ git+https://github.com/sheepfling/mdrepo.git@78476e0343f6ae3799606c17024d5aa790c6d688",
]

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]

[tool.setuptools.package-data]
"tools.hwrepo" = ["kicad_library_license.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["tools"]
extraPaths = ["."]
exclude = ["build"]

[tool.rumdl]
line-length = 100
extend-enable = ["MD029", "MD060"]
exclude = [".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md"]

[tool.rumdl.MD013]
line-length = 100
code-blocks = false
tables = false
reflow = true

[tool.rumdl.MD029]
style = "ordered"

[tool.rumdl.MD060]
style = "aligned"

[tool.mdrepo]
include = ["*.md", "**/*.md"]
exclude = [".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md"]

[tool.mdrepo.links]
check-missing-targets = false
check-case = true

[tool.mdrepo.orphans]
enabled = true
roots = [
  "README.md",
  "examples/projects/arduino-uno-status-led/README.md",
  "examples/projects/controller/README.md",
  "examples/projects/passive-signal-reference/README.md",
  "examples/projects/raspberry-pi-status-led/README.md",
  "examples/projects/status-indicator-harness-interface/README.md",
  "examples/projects/status-indicator-wiring/README.md",
  "examples/products/status-indicator-system/README.md",
]
